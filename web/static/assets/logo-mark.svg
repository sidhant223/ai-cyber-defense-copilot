<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" width="32" height="32">
  <style>
    :root {
      --logo-ink: currentColor;
      --logo-accent: var(--absent, #DC2626);
      --logo-accent-tint: var(--absent-tint, rgba(220, 38, 38, 0.12));
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-accent: var(--absent, #EF4444);
        --logo-accent-tint: var(--absent-tint, rgba(239, 68, 68, 0.16));
      }
    }
    .block-filled { fill: var(--logo-ink); fill-opacity: 0.85; }
    .block-missing {
      fill: var(--logo-accent-tint);
      stroke: var(--logo-accent);
      stroke-width: 1.3;
      stroke-dasharray: 2.5 1.5;
    }
  </style>
  <!-- Row 1 -->
  <rect class="block-filled" x="2" y="2" width="8" height="8" rx="2"/>
  <rect class="block-filled" x="12" y="2" width="8" height="8" rx="2"/>
  <rect class="block-filled" x="22" y="2" width="8" height="8" rx="2"/>
  <!-- Row 2 -->
  <rect class="block-filled" x="2" y="12" width="8" height="8" rx="2"/>
  <rect class="block-filled" x="12" y="12" width="8" height="8" rx="2"/>
  <!-- Missing control (Row 2, Col 3) -->
  <rect class="block-missing" x="22.75" y="12.75" width="6.5" height="6.5" rx="1.6"/>
  <!-- Row 3 -->
  <rect class="block-filled" x="2" y="22" width="8" height="8" rx="2"/>
  <rect class="block-filled" x="12" y="22" width="8" height="8" rx="2"/>
  <rect class="block-filled" x="22" y="22" width="8" height="8" rx="2"/>
</svg>
