  - name: express-secure-notes
    framework: express
    language: javascript
    source: "generated from PROMPT.md; the prompt asked for the controls"
    kind: negative-control
    split: dev
    expected:
      AUTH-002: present
      AUTH-003: present
      AUTH-004: present
      AUTH-005: present
      AUTH-006: present
      AUTH-008: absent           # express-session; SameSite=lax alone is not a CSRF defence
      AUTH-009: not_applicable   # session cookie maxAge is not an issued token
      AUTH-010: present          # /register validates z.string().min(12) (routes/auth.js:10)
      INPUT-001: partial         # see notes -- a true finding, not a false positive
      INPUT-002: present
      INPUT-003: not_applicable
      INPUT-004: present
      RATE-001: present
      RATE-002: present
      RATE-003: present
      SECRET-001: present
      SECRET-002: present
      SECRET-003: present
      SECRET-004: not_applicable
      SECRET-005: present          # session secret and DB password both from process.env
      AC-001: present
      AC-002: present
      AC-003: present
      AC-004: present
      AC-006: present          # global handler returns a fixed 'internal error'
    skipped: [AUTH-001, AUTH-007, AC-005]
    notes: >
      Second negative control, and not a perfect score. routes/admin.js reads
      req.params.id with no zod schema in that file, while every other route
      module validates. That is a real, if minor, gap and the manifest records
      it as one rather than tuning it away: a corpus that only contains
      findings the scanner already gets right measures nothing.
