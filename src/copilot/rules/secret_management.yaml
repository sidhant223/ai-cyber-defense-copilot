category: secret_management
description: >
  Checks whether credentials live outside the source tree. Two controls are
  pattern-based (known key formats, connection strings), one is a subject/guard
  check on configuration assignments, and two are implemented in Python
  because entropy scoring and .gitignore correlation are not pattern-shaped.

controls:
  - id: SECRET-001
    name: No credentials in recognised provider formats
    severity: critical
    cwe: CWE-798
    owasp: A07:2021
    confidence: high   # known provider key formats, not a heuristic
    description: >
      Provider keys have distinctive prefixes and lengths. A match here is a
      near-certain live credential, not a heuristic.
    applies_to: {}
    detection:
      mode: presence
      patterns:
        match: content
        any_of:
          - '\bAKIA[0-9A-Z]{16}\b'                              # AWS access key id
          - '\bASIA[0-9A-Z]{16}\b'                              # AWS temporary key
          - '\bsk_(?:live|test)_[0-9a-zA-Z]{16,}'               # Stripe secret key
          - '\brk_(?:live|test)_[0-9a-zA-Z]{16,}'               # Stripe restricted key
          - '\bgh[pousr]_[A-Za-z0-9]{36,}'                      # GitHub token
          - '\bgithub_pat_[A-Za-z0-9_]{22,}'                    # GitHub fine-grained PAT
          - '\bAIza[0-9A-Za-z\-_]{35}\b'                        # Google API key
          - '\bya29\.[0-9A-Za-z\-_]+'                           # Google OAuth token
          - '\bxox[baprs]-[0-9A-Za-z-]{10,}'                    # Slack token
          - '\bSG\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}'    # SendGrid
          - '\bSK[0-9a-fA-F]{32}\b'                             # Twilio
          - '\bglpat-[A-Za-z0-9_\-]{20,}'                       # GitLab PAT
          - '\bdop_v1_[a-f0-9]{64}'                             # DigitalOcean
          - '\bnpm_[A-Za-z0-9]{36}'                             # npm token
          - '-----BEGIN\s+(?:RSA|EC|DSA|OPENSSH|PGP)?\s*PRIVATE KEY'
          - '\beyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'  # JWT
        none_of:
          - '(?i)example|placeholder|your[-_ ]?key|xxxx|dummy|redacted|fake|sample'
          - '(?i)AKIAIOSFODNN7EXAMPLE'
    verdict:
      found: absent
      not_found: present
    remediation_hint: >
      Treat every matched key as compromised: rotate it at the provider first,
      then remove it from the code. Removing it from the working tree is not
      enough on its own -- it stays in git history, so purge or rotate.
      Afterwards read the value from the environment or a secret manager.

  - id: SECRET-002
    name: No credentials embedded in connection strings
    severity: critical
    cwe: CWE-798
    owasp: A07:2021
    confidence: high   # scheme://user:password@ is a fixed URL format
    description: >
      A database or broker URL with a password in it is a credential, however
      ordinary the surrounding code looks.
    applies_to: {}
    detection:
      mode: presence
      patterns:
        match: content
        any_of:
          - '\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|ftp|sftp)://[^:/@\s"''`]+:[^@\s"''`]+@'
          - '\b(?:Password|Pwd)\s*=\s*[^;"''\s]{4,}\s*;'        # ODBC style
        none_of:
          - '(?i)://[^:@\s]*:(?:password|passwd|pass|changeme|secret|your[-_]?password|xxx+|placeholder|example|<[^>]+>)@'
          - '\$\{[^}]*\}|\{\{[^}]*\}\}|%\([^)]*\)s'
    verdict:
      found: absent
      not_found: present
    remediation_hint: >
      Build the URL at runtime from environment variables, or store the whole
      URL in one environment variable. Rotate the password that appeared in
      source; it must be assumed known.

  - id: SECRET-003
    name: No high-entropy literals in source
    severity: high
    cwe: CWE-798
    owasp: A07:2021
    description: >
      String literals dense enough to be random keys, judged by Shannon
      entropy rather than by pattern.
    rationale: >
      Catches credentials that no prefix rule knows about. Implemented in
      Python because entropy is a computation, not a match. Threshold choice
      and its recall cost are documented in docs/controls.md.
    applies_to: {}
    detection:
      mode: custom
    verdict: {}
    remediation_hint: >
      Move the value into the environment or a secret manager and read it at
      startup. If the literal is genuinely not a secret -- a fixture, a public
      key, a test vector -- move it under a tests or fixtures path, which the
      entropy check already allowlists.

  - id: SECRET-004
    name: Environment files excluded from version control
    severity: high
    cwe: CWE-538
    owasp: A01:2021
    description: >
      A .env in the tree is only safe if .gitignore covers it. Checked by
      correlating the two, which no single pattern can do.
    applies_to: {}
    detection:
      mode: custom
    verdict: {}
    remediation_hint: >
      Add .env (and its per-environment variants) to .gitignore, commit a
      .env.example carrying names but no values, and rotate anything the real
      file already exposed.

  - id: SECRET-005
    name: Secret configuration read from the environment
    severity: high
    cwe: CWE-798
    owasp: A07:2021
    description: >
      Configuration keys whose names say "credential" should be assigned from
      the environment, not from a literal.
    applies_to:
      index_buckets: [source, config]
      exclude_patterns:
        - "**/.env"
        - "**/.env.*"
        - "**/tests/**"
        - "**/test_*.py"
        - "**/*.test.js"
        - "**/*.spec.ts"
        - "**/fixtures/**"
        - "**/examples/**"
    detection:
      mode: subject_guard
      subject:
        type: regex
        description: secret-named configuration assignment
        flags: [ignorecase]
        # Bare "secret" is included so JWT_SECRET and APP_SECRET are caught,
        # not only the SECRET_KEY spelling.
        # The optional quote before the separator catches dict-literal config,
        # which is how Django and most JS config objects are written:
        #   "PASSWORD": "hunter2"
        # The value must look like a literal OR like an environment read.
        # Requiring a quote (the original form) meant an environment read was
        # never a subject, so the control could only ever report absent or
        # not-applicable -- it could not say "three of four secrets come from
        # the environment", which is the PARTIAL case it exists for. Found by
        # writing its rule examples; see rules/tests/secret_management.yaml.
        pattern: '\b\w*(?:secret|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?token|access[_-]?token|db[_-]?password|password|passwd)\w*["'']?\s*[:=]\s*(?:["''`]|(?:os\.)?environ|os\.getenv|getenv\s*\(|process\.env|config\s*\(|Config\s*\(|get_secret|getSecret|SecretClient|KeyVault|SecretsManager|ssm\.|Field\s*\(|dotenv)'
        exclude:
          - '["''`]\s*["''`]'                                   # assigned an empty string
          - '["''`](?:your|my|the)[-_ ]|example|placeholder|changeme|dummy|redacted|xxx+|<[^>]+>'
          - '\$\{[^}]*\}|\{\{[^}]*\}\}'
          # A value containing whitespace is prose, not a credential:
          # {"secret_management": "Secret management"} is a label. Found by
          # scanning this tool with itself.
          - '[:=]\s*["''`][^"''`]*\s[^"''`]*["''`]'
      guard:
        type: regex
        description: read from the environment
        scope: same_line
        any_of:
          - 'os\.(?:environ|getenv)|environ\.get|getenv\s*\('
          - 'process\.env'
          - 'config\s*\(|Config\s*\(|dotenv|load_dotenv'
          - 'get_secret|getSecret|SecretClient|KeyVault|SecretsManager|ssm\.'
          - 'Field\s*\(\s*(?:\.\.\.|default_factory)'
    verdict:
      all_subjects_guarded: present
      some_subjects_guarded: partial
      no_subjects_guarded: absent
      no_subjects_found: not_applicable
    remediation_hint: >
      Read secret configuration from the environment with a required lookup
      that fails loudly at startup when it is missing, rather than from a
      literal with a default baked in.
