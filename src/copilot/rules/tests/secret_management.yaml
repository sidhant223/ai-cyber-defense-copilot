# Executable examples for secret_management.yaml. See authentication.yaml in
# this directory for what these are and how they run.
#
# The key-shaped strings below are fixtures, not credentials: SECRET-001 is a
# format check, so an example has to carry a string in a live format for the
# control to have anything to find. The Stripe value is the one published in
# Stripe's own documentation.

SECRET-001:
  - name: provider key in a recognised format
    expect: absent
    files:
      config.py: |
        STRIPE_SECRET = "sk_test_4eC39HqLyjWDarjtT1zdp7dc"

  - name: key read from the environment
    expect: present
    files:
      config.py: |
        import os

        STRIPE_SECRET = os.environ["STRIPE_SECRET"]

  - name: documented placeholder is not a credential
    expect: present
    files:
      config.py: |
        AWS_ACCESS_KEY_ID = "AKIAIOSFODNN7EXAMPLE"

SECRET-002:
  - name: password inside a connection string
    expect: absent
    files:
      settings.py: |
        DATABASE_URL = "postgresql://notes_app:8Hq2wFt5Rn@db.internal:5432/notes"

  - name: connection string built from the environment
    expect: present
    files:
      settings.py: |
        import os

        DATABASE_URL = f"postgresql://notes_app:{os.environ['DB_PASSWORD']}@db:5432/notes"

SECRET-003:
  - name: high-entropy literal in source
    expect: absent
    files:
      config.py: |
        API_TOKEN = "Zq7mB2tXvR9pLk4WsCe1Ny"

  - name: long literal that is structurally not a secret
    expect: present
    files:
      config.py: |
        DOCS_URL = "https://docs.example.com/getting-started"

SECRET-004:
  - name: .env committed with no .gitignore rule
    expect: absent
    files:
      .env: |
        DB_PASSWORD=8Hq2wFt5Rn
      .gitignore: |
        __pycache__/

  - name: .env excluded from version control
    expect: present
    files:
      .env: |
        DB_PASSWORD=8Hq2wFt5Rn
      .gitignore: |
        .env
        __pycache__/

  - name: no .env in the tree
    expect: not_applicable
    files:
      .gitignore: |
        __pycache__/

SECRET-005:
  - name: secret assigned a literal
    expect: absent
    files:
      config.py: |
        SECRET_KEY = "keyboard-cat"

  # These two were what exposed the subject pattern only matching quoted
  # values, which made PRESENT and PARTIAL unreachable. The rule was fixed
  # rather than the examples.
  - name: secrets read from the environment
    expect: present
    files:
      config.py: |
        import os

        SECRET_KEY = os.environ["SECRET_KEY"]
        JWT_SECRET = os.getenv("JWT_SECRET")

  - name: one of two secrets hardcoded
    expect: partial
    files:
      config.py: |
        import os

        SECRET_KEY = os.environ["SECRET_KEY"]
        JWT_SECRET = "keyboard-cat"
