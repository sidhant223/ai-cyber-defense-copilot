# Scanning this repository with its own scanner, in CI.
#
#   copilot scan . --config config/self-scan.copilot.yaml
#
# Three parts of this tree would make that meaningless, and each is excluded
# for a reason rather than to make the number look better:
#
# * corpus/ is deliberately vulnerable. Those samples are the test data; the
#   tool reporting their gaps is it working, not this repository failing.
# * src/copilot/rules/ holds regexes and, under tests/, example code with
#   key-shaped fixtures in it. A pattern that matches secrets reads as a
#   secret to an entropy check.
# * tests/ and docs/nightwatch/ are fixtures and captured output.
#
# What is left is the tool's own source, which is what a self-scan should
# actually be judging.
ignore_paths:
  - "corpus/**"
  - "src/copilot/rules/**"
  - "tests/**"
  - "docs/nightwatch/**"
  - "report.html"

# Three findings on the tool's own source, accepted with reasons rather than
# excluded quietly. Both are the documented cost of matching lines with
# regexes instead of parsing them.
suppress:
  - control: AC-004
    reason: >
      The two matches are route decorators inside docstrings -- examples that
      document the rule language, not routes that serve traffic. Regex cannot
      tell a docstring from code, which docs/controls.md records as a limit.
  - control: RATE-003
    reason: >
      The only HTTP server here is web/server.py: a single-user tool bound to
      127.0.0.1 that refuses non-local Host and cross-site requests. There is
      no public request rate to limit. The control has no framework to key on
      and so cannot work this out for itself.
  - control: AC-006
    reason: >
      The matches are the browser UI (web/static/*.js) showing `e.message` from
      the local server's JSON errors. Those messages are fixed, user-facing
      ScanError text -- never exception detail or stack traces -- and client
      code displaying an error is not a server response leaking one. Regex
      cannot tell client from server code.
